set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -s escape-time 10
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 20
set -g status-right-length 40
set -g status-justify left
set -g window-status-separator ""
set -g status-style "bg=#1F1F28,fg=#DCD7BA"
set -g status-left "#[fg=#181820,bg=#7E9CD8,bold] #S #[default]"
set -g status-right "#[fg=#727169]#H  #[fg=#C8C093]%H:%M "
setw -g window-status-format " #[fg=#727169]#I:#W "
setw -g window-status-current-format " #[fg=#181820,bg=#98BB6C,bold] #I:#W #[default]"
set -g pane-border-style "fg=#2A2A37"
set -g pane-active-border-style "fg=#7E9CD8"
set -g message-style "bg=#2D4F67,fg=#DCD7BA"
set -g mode-style "bg=#2D4F67,fg=#DCD7BA"
